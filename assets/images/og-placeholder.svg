<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Degraft Portfolio Placeholder</title>
  <desc id="desc">Dark gradient placeholder for Degraft portfolio.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050b16"/>
      <stop offset="100%" stop-color="#111d2f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6a8dff"/>
      <stop offset="100%" stop-color="#2ec5ff"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="200" cy="160" r="180" fill="rgba(106,141,255,0.18)"/>
  <circle cx="980" cy="500" r="220" fill="rgba(46,197,255,0.12)"/>
  <rect x="120" y="120" width="960" height="390" rx="28" fill="rgba(17,26,43,0.75)" stroke="rgba(255,255,255,0.12)"/>
  <text x="170" y="250" fill="#edf5ff" font-family="Arial, sans-serif" font-size="62" font-weight="700" letter-spacing="8">DEGRAFT</text>
  <text x="170" y="325" fill="url(#accent)" font-family="Arial, sans-serif" font-size="44" font-weight="700">ASPIRING SOFTWARE ENGINEER</text>
  <text x="170" y="380" fill="#a7b8d6" font-family="Arial, sans-serif" font-size="28">Building technology that solves real-world problems.</text>
</svg>
